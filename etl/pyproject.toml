[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plant-data-bridge-etl"
version = "0.1.0"
description = "BrAPI ETL and Elasticsearch indexing prototype for federated plant data"
requires-python = ">=3.11"
dependencies = [
    "requests==2.32.3",
    "elasticsearch==8.15.1",
    "pydantic==2.9.2"
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["plantbridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
